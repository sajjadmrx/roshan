# رشته‌های فارسی روشن
# Follows TYPOGRAPHY.md: casual modern tone, no tanween, no trailing periods,
# no exclamation marks, real half-spaces (ZWNJ), Persian digits.
# Right-to-left text is not wrapped automatically: break long strings with \n
# so that each line fits the compact window (about 40 characters).

