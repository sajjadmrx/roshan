<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .kinds { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .kind { font-size: 18px; color: var(--muted); }
  .kind strong { color: var(--text); font-weight: 600; margin-right: 6px; }
</style></head>
<body><div class="canvas">
  <div class="copy">
    <div class="eyebrow">Real apps only</div>
    <h1>Pick from what<br>you actually have.</h1>
    <p class="lead">Roshan lists the apps installed on your computer, with their real names and icons. No catalog, no guessing.</p>
    <div class="kinds">
      <div class="kind"><strong>Apps</strong>from your Start menu</div>
      <div class="kind"><strong>Commands</strong>in a terminal window or in the background</div>
      <div class="kind"><strong>Links, files and folders</strong>opened with their default app</div>
    </div>
  </div>
  <div class="pair">
    <div class="win"><img src="shots/en-picker-dark.png" alt=""></div>
    <div class="win"><img src="shots/en-session-dark.png" alt=""></div>
  </div>
</div></body></html>
