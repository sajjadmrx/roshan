<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { font-family: "Vazirmatn", sans-serif; }
  .canvas { direction: rtl; }
  h1 { font-family: "Vazirmatn", sans-serif; font-weight: 700; font-size: 56px; line-height: 1.3; letter-spacing: 0; }
  p.lead { font-size: 21px; line-height: 1.8; }
  .facts span::before { margin-right: 0; margin-left: 8px; }
  .pair .win:first-child { left: auto; right: 0; }
  .pair .win:last-child { left: auto; right: 260px; }
  .latin { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; direction: ltr; unicode-bidi: isolate; }
  .canvas { gap: 44px; }
  .eyebrow { letter-spacing: 0; font-size: 17px; }
  .steps { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .step {
    display: flex; align-items: center; gap: 14px;
    padding: 11px 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); font-size: 18px;
  }
  .step b { width: 22px; color: var(--faint); font-weight: 700; }
  .step em { margin-right: auto; font-style: normal; font-size: 15px; color: var(--faint); }
  .arrow { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 120px;
           text-align: center; font-size: 16px; line-height: 1.6; color: var(--muted); }
  .arrow b { font-size: 30px; font-weight: 400; color: var(--faint); }
</style></head>
<body><div class="canvas">
  <div class="copy">
    <div class="eyebrow">مشکل</div>
    <h1>هر روز همون کارها<br>دستی و تکراری</h1>
    <div class="steps">
      <div class="step"><b>۱</b><span><span class="latin">Windscribe</span> رو باز کن</span><em>صبر کن <span class="latin">VPN</span> وصل شه</em></div>
      <div class="step"><b>۲</b><span>ترمینال رو باز کن و <span class="latin">9router</span> رو بزن</span><em>صبر کن بالا بیاد</em></div>
      <div class="step"><b>۳</b><span><span class="latin">Claude</span> رو باز کن</span></div>
      <div class="step"><b>۴</b><span><span class="latin">Telegram</span> رو باز کن</span></div>
    </div>
  </div>
  <div class="arrow"><b>&larr;</b>با روشن<br>فقط یه بار<br>اجرا رو بزن</div>
  <div class="win"><img src="shots/fa-running-dark.png" alt=""></div>
</div></body></html>
