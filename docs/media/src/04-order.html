<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .points { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
  .point { display: flex; gap: 14px; font-size: 18px; line-height: 1.45; color: var(--muted); }
  .point strong { color: var(--text); font-weight: 600; }
  .point i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); margin-top: 10px; }
</style></head>
<body><div class="canvas">
  <div class="copy">
    <div class="eyebrow">Order and timing</div>
    <h1>VPN first.<br>Then everything else.</h1>
    <div class="points">
      <div class="point"><i></i><span><strong>Drag to set the order.</strong> Items open from top to bottom.</span></div>
      <div class="point"><i></i><span><strong>Add a pause after any step,</strong> so a slow app is ready before the next one needs it.</span></div>
      <div class="point"><i></i><span><strong>Honest progress.</strong> You see what launched, what failed and why.</span></div>
    </div>
  </div>
  <div class="win"><img src="shots/en-editor-dark.png" alt=""></div>
</div></body></html>
