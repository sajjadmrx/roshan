<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { font-family: "Vazirmatn", sans-serif; }
  .canvas { direction: rtl; }
  h1 { font-family: "Vazirmatn", sans-serif; font-weight: 700; font-size: 56px; line-height: 1.3; letter-spacing: 0; }
  p.lead { font-size: 21px; line-height: 1.8; }
  .facts span::before { margin-right: 0; margin-left: 8px; }
  .pair .win:first-child { left: auto; right: 0; }
  .pair .win:last-child { left: auto; right: 260px; }
  .latin { font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; direction: ltr; unicode-bidi: isolate; }
  .brand { font-size: 22px; }
</style></head>
<body><div class="canvas">
  <div class="copy">
    <div class="brand"><img src="../../../crates/roshan/assets/logo/roshan.png" alt="">روشن</div>
    <h1>همه‌ی برنامه‌هات<br>با یه کلیک</h1>
    <p class="lead">روشن برنامه‌ها و دستورهایی که هر روز باز می‌کنی رو به ترتیب درست و با مکث مناسب اجرا می‌کنه، هر وقت که آماده بودی</p>
    <div class="facts"><span>رایگان و متن‌باز</span><span>آفلاین</span><span>بدون ثبت‌نام</span></div>
  </div>
  <div class="pair">
    <div class="win"><img src="shots/fa-list-dark.png" alt=""></div>
    <div class="win"><img src="shots/fa-session-dark.png" alt=""></div>
  </div>
</div></body></html>
